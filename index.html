<!DOCTYPE html>
<html>
<head>
    <title>Hello</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
        }

        .box {
            background: white;
            padding: 50px 70px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            font-size: 70px;
            color: #333;
            margin: 0;
        }

        p {
            font-size: 22px;
            color: #777;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Hello 👋</h1>
        <p>Have a nice day! ✨</p>
    </div>

</body>
</html>
